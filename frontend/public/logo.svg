<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base (Dark Obsidian Matte) -->
  <rect width="600" height="600" rx="48" fill="url(#logoBg)"/>
  <rect width="596" height="596" x="2" y="2" rx="46" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Brand Mark Group -->
  <g transform="translate(0, 0)">
    <!-- GEP Bold Letters -->
    <text 
      x="300" 
      y="310" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" 
      font-size="160" 
      font-weight="900" 
      letter-spacing="-5" 
      fill="#ffffff" 
      text-anchor="middle"
    >GEP</text>

    <!-- Subtitle: ORDER MANAGEMENT + Emerald Dot -->
    <text 
      x="285" 
      y="370" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" 
      font-size="21" 
      font-weight="700" 
      letter-spacing="5" 
      fill="#e4e4e7" 
      text-anchor="middle"
    >ORDER MANAGEMENT</text>

    <!-- Refined Emerald Green Accent Dot -->
    <circle cx="485" cy="363" r="10" fill="#10b981" filter="url(#emeraldGlow)"/>
  </g>
</svg>
