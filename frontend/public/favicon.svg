<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- GEP Bold Monogram -->
  <text 
    x="230" 
    y="305" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" 
    font-size="160" 
    font-weight="900" 
    letter-spacing="-4" 
    fill="#ffffff" 
    text-anchor="middle"
  >GEP</text>

  <!-- Emerald Green Dot Accent -->
  <circle cx="405" cy="275" r="22" fill="#10b981" filter="url(#glow)"/>
</svg>
